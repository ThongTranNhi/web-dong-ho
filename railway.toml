# Railway: build từ Dockerfile ở thư mục gốc. Biến môi trường và volume cấu hình trên
# dashboard Railway – xem docs/DOCKER_DEPLOY.md, mục "Deploy lên Railway".
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Kiểm tra PHP + kết nối database, không phụ thuộc WordPress đã cài đặt hay chưa.
healthcheckPath = "/healthz.php"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
