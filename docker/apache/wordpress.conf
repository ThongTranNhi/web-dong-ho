# Virtual host WordPress. Cổng lấy từ biến môi trường PORT (mặc định 8080; Railway tự cấp).
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        # Cho phép .htaccess của plugin (vd. WooCommerce chặn thư mục tải xuống trong uploads).
        AllowOverride All
        Require all granted

        # Permalink WordPress: đặt sẵn ở đây vì mã nguồn trong image là chỉ đọc.
        RewriteEngine On
        RewriteBase /
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>

    # Không thực thi PHP trong thư mục upload.
    <Directory /var/www/html/wp-content/uploads>
        <FilesMatch "\.(php|phar|phtml|php\d)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Chặn file nhạy cảm hoặc không cần công khai.
    <FilesMatch "^(wp-config.*\.php|readme\.html|license\.txt|\.env.*|.*\.(sql|log|bak|sh))$">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/\.(git|svn)">
        Require all denied
    </DirectoryMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
